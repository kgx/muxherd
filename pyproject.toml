[project]
name = "muxherd"
dynamic = ["version"]  # from git tags (vX.Y.Z) via hatch-vcs
description = "Herd AI coding agents (Claude Code, Codex, Grok) running in tmux across your tailnet"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Keith Gaputis", email = "keith@gaputis.com" }]
keywords = ["tmux", "claude-code", "codex", "ai-agents", "tui", "mosh", "tailscale", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=8.0",
    "typer>=0.15",
]

[project.urls]
Homepage = "https://github.com/kgx/muxherd"
Issues = "https://github.com/kgx/muxherd/issues"
Releases = "https://github.com/kgx/muxherd/releases"

[project.scripts]
muxherd = "muxherd.cli:main"
mh = "muxherd.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# typer.Exit inside except blocks is control flow, not error chaining
ignore = ["B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# Used when building without git metadata (e.g. from a source archive).
fallback-version = "0.0.0"
